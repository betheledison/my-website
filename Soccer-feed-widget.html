<div class="aura-footer-cta">
    <style>
        .aura-footer-cta {
            --aura-bg: #090913;
            --aura-gold: #ff9900;
            --aura-blue: #37bcf9;
            --aura-border: #1a1a2e;
            
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            background: var(--aura-bg);
            padding: 40px 20px;
            box-sizing: border-box;
            border-top: 1px solid var(--aura-border);
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
            overflow: hidden;
        }

        .cta-container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid var(--aura-border);
            background: rgba(255, 153, 0, 0.02);
            padding: 30px;
            border-radius: 4px;
            position: relative;
        }

        .cta-container::before {
            content: ">> SYSTEM_NOTIFICATION";
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--aura-bg);
            padding: 0 10px;
            color: #444;
            font-size: 0.6rem;
            font-weight: bold;
        }

        .cta-title {
            color: var(--aura-gold);
            font-size: 1.5rem;
            font-weight: 900;
            margin: 0 0 10px 0;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .cta-text {
            color: #888;
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            background: var(--aura-gold);
            color: #000;
            text-decoration: none;
            padding: 12px 30px;
            font-size: 0.8rem;
            font-weight: 900;
            border-radius: 2px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            clip-path: polygon(0 0, 95% 0, 100% 100%, 5% 100%);
        }

        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 153, 0, 0.4);
        }

        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff5f56;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 8px #ff5f56;
            animation: aura-pulse 1.5s infinite;
        }

        @keyframes aura-pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 600px) {
            .cta-title { font-size: 1.2rem; }
            .cta-text { font-size: 0.75rem; }
            .cta-button { width: 80%; justify-content: center; }
        }
    </style>

    <div class="cta-container">
        <h2 class="cta-title">
            <span class="live-indicator"></span>
            Live Soccer Stream
        </h2>
        <p class="cta-text">
            Track real-time scores, league standings, and live match data 
            across the Premier League, La Liga, and more. 
            Stay locked into the global game.
        </p>
        <a href="http://betheledison.com/live-ticker" class="cta-button">
            Launch Live Ticker
        </a>
    </div>
</div>
