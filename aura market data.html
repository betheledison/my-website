<style>
    .aura-full-width-wrapper {
        --aura-bg: #090913;
        --aura-accent: #ff9900;
        --aura-text: #ffffff;
        --aura-up: #00ff88;
        --aura-down: #ff3e3e;
        background: var(--aura-bg);
        width: 100vw;
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        padding: 60px 0;
        box-sizing: border-box;
        border-top: 2px solid var(--aura-accent);
        border-bottom: 2px solid var(--aura-accent);
        overflow: hidden;
        z-index: 99;
    }

    .aura-content { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    .aura-content h2 { color: var(--aura-accent); text-align: center; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 30px; font-size: 1.6rem; }

    .aura-table { width: 100%; border-collapse: collapse; background: rgba(255, 255, 255, 0.03); border-radius: 12px; overflow: hidden; }
    .aura-table th { background: rgba(255, 153, 0, 0.15); color: var(--aura-accent); text-align: left; padding: 18px; font-size: 0.8rem; text-transform: uppercase; }
    .aura-table td { padding: 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 1.1rem; font-weight: 600; color: #fff; }

    .price-cell { font-family: monospace; transition: all 0.3s ease; }
    .aura-up-flash { color: var(--aura-up) !important; text-shadow: 0 0 10px var(--aura-up); }
    .aura-down-flash { color: var(--aura-down) !important; text-shadow: 0 0 10px var(--aura-down); }
    
    .aura-btn-area { display: flex; justify-content: center; margin-top: 35px; }
    .aura-vip-link { background: var(--aura-accent); color: var(--aura-bg) !important; text-decoration: none !important; padding: 18px 50px; border-radius: 8px; font-weight: 900; text-transform: uppercase; transition: 0.3s; border: 2px solid var(--aura-accent); }
    .aura-vip-link:hover { background: transparent; color: var(--aura-accent) !important; box-shadow: 0 0 25px rgba(255,153,0,0.4); }

    @media (max-width: 500px) { .aura-table th:nth-child(3), .aura-table td:nth-child(3) { display: none; } }
</style>

<div class="aura-full-width-wrapper">
    <div class="aura-content">
        <h2>Aura Live Market</h2>
        <table class="aura-table">
            <thead>
                <tr>
                    <th>Asset</th>
                    <th>Price (USD)</th>
                    <th>24H</th>
                </tr>
            </thead>
            <tbody id="aura-live-body"></tbody>
        </table>
        <div class="aura-btn-area">
            <a href="http://betheledison.com/vip-zone" class="aura-vip-link">Enter VIP Zone</a>
        </div>
    </div>
</div>

<script>
(function() {
    const coins = {
        'BTCUSDT': { name: 'Bitcoin', cg: 'bitcoin' },
        'ETHUSDT': { name: 'Ethereum', cg: 'ethereum' },
        'SOLUSDT': { name: 'Solana', cg: 'solana' },
        'BNBUSDT': { name: 'Binance', cg: 'binancecoin' },
        'PIUSDT': { name: 'Pi Network', cg: 'pi-network' }
    };

    const tbody = document.getElementById('aura-live-body');
    
    // Build Table Rows Immediately
    Object.keys(coins).forEach(symbol => {
        tbody.innerHTML += `
            <tr id="row-${symbol}">
                <td><strong>${symbol.replace('USDT','')}</strong> <small style="color:#666; margin-left:5px;">${coins[symbol].name}</small></td>
                <td class="price-cell" id="val-${symbol}">Connecting...</td>
                <td id="pct-${symbol}">--</td>
            </tr>
        `;
    });

    // Strategy 1: The WebSocket (Primary for High Speed)
    function startWebSocket() {
        const stream = Object.keys(coins).filter(s => s !== 'PIUSDT').map(s => `${s.toLowerCase()}@ticker`).join('/');
        const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${stream}`);
        
        ws.onmessage = (e) => {
            const d = JSON.parse(e.data);
            updateRow(d.s, d.c, d.P, true);
        };
        
        ws.onerror = () => setTimeout(startWebSocket, 5000); // Auto-reconnect
    }

    // Strategy 2: Proxy Fetch (Fixes the CORS "Stuck" Issue)
    async function fetchBackup() {
        try {
            // Using a CORS-friendly proxy for 2026 data standards
            const ids = Object.values(coins).map(c => c.cg).join(',');
            const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
            const d = await r.json();
            
            Object.keys(coins).forEach(symbol => {
                const cgId = coins[symbol].cg;
                if(d[cgId]) updateRow(symbol, d[cgId].usd, d[cgId].usd_24h_change, false);
            });
        } catch(e) { 
            console.log("Retrying connection...");
            setTimeout(fetchBackup, 3000);
        }
    }

    function updateRow(sym, price, pct, flash) {
        const pEl = document.getElementById(`val-${sym}`);
        const cEl = document.getElementById(`pct-${sym}`);
        if (!pEl) return;

        const current = parseFloat(pEl.innerText.replace(/[$,Connecting]/g, '')) || 0;
        const next = parseFloat(price);
        
        if (flash && current !== 0 && current !== next) {
            pEl.className = next > current ? 'price-cell aura-up-flash' : 'price-cell aura-down-flash';
            setTimeout(() => pEl.className = 'price-cell', 600);
        }
        
        pEl.innerText = `$${next.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        cEl.innerText = `${parseFloat(pct).toFixed(2)}%`;
        cEl.style.color = parseFloat(pct) >= 0 ? 'var(--aura-up)' : 'var(--aura-down)';
    }

    // Launch both strategies
    startWebSocket();
    fetchBackup();
    setInterval(fetchBackup, 20000); // Keep Pi updated
})();
</script>
